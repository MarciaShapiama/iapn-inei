# Publica el tablero (carpeta dashboard/) en GitHub Pages cada vez que cambia o se actualizan los datos.
name: Publicar tablero

on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  workflow_run:
    workflows: ["Actualizar datos", "Inundaciones Tumbes y Piura", "Base para el modelo", "Fotos satelitales"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard
      # GitHub a veces no encuentra el paquete recién subido; se reintenta hasta dos veces más.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes del último intento
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
