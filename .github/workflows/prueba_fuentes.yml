name: Prueba de fuentes
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q openpyxl pandas xlrd pdfplumber
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir -p /tmp/t && cd /tmp/t
          for id in 7162639-tabla-1-emergencias-y-danos-2003-2024-indeci 7162698-tabla-2-peligros-2003-2024-indeci; do
            curl -sS -A "$UA" -L --max-time 120 -o p.html "https://www.gob.pe/institucion/indeci/informes-publicaciones/$id"
            for f in $(grep -o 'https://cdn.www.gob.pe/uploads/document/file/[^"?]*' p.html | sort -u | head -4); do
              n=$(basename "$f"); echo "== $id -> $n"; curl -sS -A "$UA" -L --max-time 180 -o "$n" "$f"; ls -la "$n"; done
          done
          python3 - <<'PY'
          import glob, pandas as pd
          for f in sorted(glob.glob("/tmp/t/*")):
              if f.endswith(".html"): continue
              print("#####", f)
              try:
                  if f.lower().endswith((".xlsx",".xls")):
                      x = pd.ExcelFile(f); print("hojas:", x.sheet_names[:15])
                      d = pd.read_excel(f, sheet_name=x.sheet_names[0], header=None, nrows=25); print(d.iloc[:25,:12].to_string()[:3500])
                  elif f.lower().endswith(".pdf"):
                      import pdfplumber
                      with pdfplumber.open(f) as p:
                          print("paginas", len(p.pages)); print(p.pages[0].extract_text()[:1500]); print(p.pages[min(3,len(p.pages)-1)].extract_text()[:1500])
                  else:
                      print(open(f,"rb").read(300))
              except Exception as e: print("ERR", e)
          PY
