name: Prueba de fuentes
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in "https://www.datosabiertos.gob.pe/sites/default/files/RENIPRESS_30-09-2026.csv" \
                   "https://www.datosabiertos.gob.pe/dataset/renipress" \
                   "http://app20.susalud.gob.pe:8080/registro-renipress-webapp/listadoEstablecimientosRegistrados.htm" \
                   "https://data.source.coop/vida/google-microsoft-open-buildings/geoparquet/by_country_s2/country_iso=PER/10394307939971104768.parquet"; do
            echo "== $u"; curl -sS -A "$UA" -o /tmp/x -w "%{http_code} %{size_download} %{content_type}\n" -L --max-time 90 -r 0-3000 "$u"; head -c 400 /tmp/x | tr -d '\0' | tr '\n' ' '; echo; done
          echo "== OVERPASS"
          Q='[out:json][timeout:120];area["name"="Piura"]["admin_level"="4"]->.p;area["name"="Tumbes"]["admin_level"="4"]->.t;(nwr["amenity"~"^(school|hospital|clinic|doctors|kindergarten)$"](area.p);nwr["amenity"~"^(school|hospital|clinic|doctors|kindergarten)$"](area.t);nwr["healthcare"](area.p);nwr["healthcare"](area.t););out center tags;'
          curl -sS --max-time 180 -A "$UA" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o /tmp/o.json -w "%{http_code} %{size_download}\n"
          python3 -c "import json,collections;j=json.load(open('/tmp/o.json'));c=collections.Counter((e['tags'].get('amenity') or 'hc:'+e['tags'].get('healthcare','')) for e in j['elements']);print(len(j['elements']),c.most_common(10));print([e['tags'].get('name') for e in j['elements'][:8]])"
