name: Prueba de fuentes
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L --max-time 300 -o /tmp/d.zip "https://www.desinventar.net/DesInventar/download/DI_export_per.zip"
          cd /tmp && unzip -o -q d.zip && ls -la /tmp/*.xml
          F=$(ls /tmp/*.xml | head -1)
          python3 - "$F" <<'PY'
          import sys,re
          t=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          print("tamaño",len(t))
          tags=re.findall(r"<([A-Za-z_]+)[ >]",t[:3000000]);
          from collections import Counter; print(Counter(tags).most_common(40))
          i=t.find("<fichas"); print(t[i:i+3000] if i>=0 else t[:3000])
          j=t.find("<lev2"); print(t[j:j+800])
          j=t.find("<eventos"); print(t[j:j+1500])
          import collections
          years=collections.Counter(re.findall(r"<fechano>(\d{4})</fechano>",t)); print(sorted(years.items())[-25:])

          PY
