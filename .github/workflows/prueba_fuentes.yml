name: Prueba de fuentes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt -r requirements-inundaciones.txt
      - run: python -u src/exposicion_extra.py
      - name: Guardar
        run: |
          git config user.name "Actualización automática"
          git config user.email "actions@users.noreply.github.com"
          git add data/exposicion dashboard/data/enfen.json || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Exposición adicional: edades, cultivos, vías y ENFEN"
          git pull --rebase origin main
          git push
