name: Prueba GFM Copernicus
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pystac-client rasterio numpy
      - run: python -u herramientas/prueba_gfm.py
      - run: |
          git config user.name "MarciaShapiama"; git config user.email "13100817@ue.edu.pe"
          git add docs/evidencia/prueba_gfm.json && git commit -qm "Prueba con el monitor global de inundaciones de Copernicus (GFM)" && git pull --rebase --autostash origin main && git push || echo nada
