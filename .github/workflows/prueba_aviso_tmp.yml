# Temporal: prueba del aviso con pronósticos reales del pasado (Open-Meteo Previous Runs). Tres corridas.
name: Prueba aviso con pronostico real (3 corridas)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Tres corridas
        run: |
          for i in 1 2 3; do
            python -u herramientas/pruebas/prueba_aviso_pronostico_real.py
            cp docs/evidencia/prueba_aviso_pronostico_real.json /tmp/c$i.json
          done
          python -c "import json;r=[json.dumps(json.load(open(f'/tmp/c{i}.json'))['eventos'],sort_keys=True) for i in (1,2,3)];print('TRES CORRIDAS IGUALES' if len(set(r))==1 else 'CORRIDAS DISTINTAS')"
      - name: Guardar
        run: |
          git config user.name "Actualización automática"
          git config user.email "actions@users.noreply.github.com"
          git add docs/evidencia/prueba_aviso_pronostico_real.json
          git diff --cached --quiet && exit 0
          git commit -m "Prueba del aviso con pronósticos reales del pasado"
          git pull --rebase --autostash origin main && git push
