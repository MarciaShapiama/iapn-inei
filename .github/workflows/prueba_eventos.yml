name: Prueba de eventos pasados
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt -r requirements-inundaciones.txt -r requirements-dev.txt
      - run: python -u herramientas/prueba_eventos_pasados.py
      - run: |
          git config user.name "MarciaShapiama"; git config user.email "13100817@ue.edu.pe"
          git add docs/evidencia/prueba_eventos_pasados.json && git commit -qm "Prueba del radar con desbordes pasados del río Tumbes (2023 y 2025)" && git pull --rebase --autostash origin main && git push || echo nada
