# Inundaciones en Tumbes y Piura: exposición (una vez), huellas de radar Sentinel-1 y su impacto.
# Corre los lunes y jueves (Sentinel-1 pasa cada 6-12 días) y cuando se lanza a mano.
name: Inundaciones Tumbes y Piura

on:
  schedule:
    - cron: "40 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  inundaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt -r requirements-inundaciones.txt
      - name: Lo expuesto (población, viviendas, colegios, salud)
        run: python -u src/exposicion.py
        continue-on-error: true
      - name: Huellas de inundación (Sentinel-1)
        run: python -u src/huellas.py
        continue-on-error: true
      - name: Impacto
        run: python -u src/impacto.py
        continue-on-error: true
      - name: Guardar
        run: |
          git config user.name "Actualización automática"
          git config user.email "actions@users.noreply.github.com"
          git add data/exposicion data/huellas dashboard/data || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Inundaciones: actualiza huellas e impacto $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
