# Actualiza los datos todos los días a las 8:20 a. m. de Lima (13:20 UTC) en los servidores de GitHub.
# Cada día se agregan archivos nuevos en data/historico/ y nunca se borran: así se forma el histórico.
name: Actualizar datos

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Mar día a día (NOAA OISST, últimos 20 días)
        run: python src/descargar_mar.py
        continue-on-error: true
      - name: Índices, producción y electricidad
        run: python src/descargar_indicadores.py
        continue-on-error: true
      - name: Preparar datos del tablero
        run: python src/construir.py
      - name: Guardar
        run: |
          git config user.name "Actualización automática"
          git config user.email "actions@users.noreply.github.com"
          git add data dashboard/data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualiza datos $(date -u +%Y-%m-%d)"
          git push
